name: Generate Stats Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Firozkhan009
        run: |
          python3 << 'EOF'
          import urllib.request, json, datetime, os

          token = os.environ["GITHUB_TOKEN"]
          username = os.environ["USERNAME"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          query = """
          {
            user(login: "%s") {
              repositories(ownerAffiliations: OWNER) {
                totalCount
              }
              contributionsCollection(
                from: "%s"
                to: "%s"
              ) {
                totalCommitContributions
              }
              contributionsCollection2026: contributionsCollection(
                from: "2026-01-01T00:00:00Z"
                to: "%s"
              ) {
                totalCommitContributions
              }
            }
          }
          """ % (
              username,
              (datetime.datetime.utcnow() - datetime.timedelta(days=365)).strftime("%Y-%m-%dT%H:%M:%SZ"),
              datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          )

          data = json.dumps({"query": query}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=data, headers=headers, method="POST")
          with urllib.request.urlopen(req) as res:
              response_body = res.read()
              print("Response:", response_body.decode())
              result = json.loads(response_body)

          if "errors" in result:
              print("GraphQL errors:", result["errors"])
              exit(1)

          user = result["data"]["user"]
          commits_year = user["contributionsCollection"]["totalCommitContributions"]
          commits_2026 = user["contributionsCollection2026"]["totalCommitContributions"]
          total_repos  = user["repositories"]["totalCount"]

          print(f"Commits 2026: {commits_2026}")
          print(f"Commits last 12 months: {commits_year}")
          print(f"Total repos: {total_repos}")

          svg = f"""<svg width="480" height="160" xmlns="http://www.w3.org/2000/svg">
            <style>
              .title {{ font: 600 14px 'Segoe UI', sans-serif; fill: #586069; }}
              .value {{ font: 700 26px 'Segoe UI', sans-serif; fill: #24292e; }}
              .label {{ font: 400 12px 'Segoe UI', sans-serif; fill: #586069; }}
              .divider {{ stroke: #e1e4e8; stroke-width: 1; }}
            </style>
            <rect width="480" height="160" rx="12" fill="white" stroke="#e1e4e8" stroke-width="1.5"/>
            <text x="24" y="36" class="title">&#128200; GitHub Stats</text>
            <line x1="24" y1="48" x2="456" y2="48" class="divider"/>
            <text x="40" y="95" class="value">{commits_2026}</text>
            <text x="40" y="118" class="label">Commits in 2026</text>
            <line x1="186" y1="58" x2="186" y2="138" class="divider"/>
            <text x="210" y="95" class="value">{commits_year}</text>
            <text x="210" y="118" class="label">Last 12 months</text>
            <line x1="356" y1="58" x2="356" y2="138" class="divider"/>
            <text x="380" y="95" class="value">{total_repos}</text>
            <text x="380" y="118" class="label">Total Repos</text>
          </svg>"""

          with open("stats-card.svg", "w") as f:
              f.write(svg)
          print("SVG written successfully")
          EOF

      - name: Commit SVG
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats-card.svg
          git diff --cached --quiet || git commit -m "chore: update stats card"
          git push
